<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSE Portfolio — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body class="auth-body">
<div class="lang-bar">
  <button type="button" class="lang-btn" data-lang="si">සිංහල</button>
  <button type="button" class="lang-btn active" data-lang="en">EN</button>
</div>

<div class="auth-card">
  <div class="brand">
    <h1>CSE Portfolio</h1>
    <p class="sub" data-i18n="tagline">Track CSE shares · Live prices · Dividends</p>
  </div>

  <div class="auth-tabs">
    <button type="button" class="auth-tab active" data-tab="login" data-i18n="login">Sign in</button>
    <button type="button" class="auth-tab" data-tab="signup" data-i18n="signup">Sign up</button>
  </div>

  <form id="authForm" autocomplete="on">
    <label>
      <span data-i18n="email">Email</span>
      <input type="email" id="email" required placeholder="you@email.com" autocomplete="email">
    </label>
    <label>
      <span data-i18n="password">Password</span>
      <input type="password" id="password" required minlength="6" placeholder="••••••••" autocomplete="current-password">
    </label>
    <p class="err" id="authErr" hidden></p>
    <button type="submit" class="btn primary full" id="authBtn" data-i18n="loginBtn">Sign in</button>
  </form>

  <p class="fine" data-i18n="disclaimer">Not investment advice. Data may be delayed. Do your own research.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="auth.js"></script>
</body>
</html>
